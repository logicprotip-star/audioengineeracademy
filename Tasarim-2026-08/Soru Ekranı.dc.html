<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #08090b; font-family: 'Inter', -apple-system, sans-serif; }
  a { color: #4ade80; } a:hover { color: #86efac; }
  * { box-sizing: border-box; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; background: radial-gradient(ellipse at 50% 0%, #14161a 0%, #08090b 70%)">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" dark="{{ true }}" hint-size="430px,880px">
  <div style="height: 100%; display: flex; flex-direction: column; background: #0c0d0f; font-family: 'Inter', sans-serif; color: #e7e9ec; padding: 62px 16px 40px 16px; gap: 16px">

    <!-- Üst bar -->
    <div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px">
      <button onClick="{{ noop }}" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #b8bdc4; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0" style-hover="background: rgba(255,255,255,0.09)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <div style="flex: 1; min-width: 0">
        <div style="font-size: 16px; font-weight: 700; letter-spacing: -0.2px; color: #f2f3f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Frekans Bulma</div>
        <div style="display: flex; align-items: center; gap: 3px; margin-top: 3px">
          <sc-for list="{{ hearts }}" as="h" hint-placeholder-count="5">
            <svg width="13" height="13" viewBox="0 0 24 24"><path d="M12 21C7 16.5 3 13 3 8.8 3 5.9 5.2 4 7.7 4 9.4 4 11 4.9 12 6.3 13 4.9 14.6 4 16.3 4 18.8 4 21 5.9 21 8.8 21 13 17 16.5 12 21Z" fill="{{ h.fill }}" stroke="{{ h.stroke }}" stroke-width="1.5"></path></svg>
          </sc-for>
        </div>
      </div>
      <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px">
        <div style="font-size: 13px; font-weight: 700; color: #c9cdd3; font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 5px 9px">3<span style="color: #6c7178; font-weight: 500"> / 5</span></div>
        <div style="font-size: 11px; font-weight: 700; color: #e8c46a; background: rgba(232,196,106,0.12); border: 1px solid rgba(232,196,106,0.3); border-radius: 8px; padding: 6px 8px; line-height: 1">Z4</div>
      </div>
    </div>

    <!-- Spektrum -->
    <div style="flex-shrink: 0; border-radius: 18px; overflow: hidden; background: #0a0c0e; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 24px rgba(0,0,0,0.4)">
      <div style="height: 240px">{{ spectrum }}</div>
      <div style="display: flex; justify-content: space-between; padding: 8px 14px 10px 14px; border-top: 1px solid rgba(255,255,255,0.05)">
        <div style="font-size: 10px; font-weight: 600; color: #4a4f56; letter-spacing: 0.6px">20 Hz</div>
        <div style="font-size: 10px; font-weight: 600; color: #4a4f56; letter-spacing: 0.6px">SPEKTRUM ANALİZÖRÜ</div>
        <div style="font-size: 10px; font-weight: 600; color: #4a4f56; letter-spacing: 0.6px">20 kHz</div>
      </div>
    </div>

    <!-- Transport -->
    <div style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 20px">
      <button onClick="{{ togglePlay }}" style="width: 76px; height: 76px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15); background: linear-gradient(180deg, #23262b, #15171a); color: #f2f3f5; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.12)" style-hover="border-color: rgba(255,255,255,0.3)">{{ playIcon }}</button>
      <button onClick="{{ toggleBypass }}" style="height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid {{ bypassBorder }}; background: {{ bypassBg }}; color: {{ bypassColor }}; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.2px; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: {{ bypassShadow }}">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: {{ bypassDot }}"></div>
        A/B Bypass
      </button>
    </div>

    <!-- Soru -->
    <div style="flex-shrink: 0; text-align: center; font-size: 14px; font-weight: 600; color: #9ba0a8">Hangi frekans bandı artırıldı?</div>

    <!-- Cevaplar -->
    <div style="flex-shrink: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
      <sc-for list="{{ answers }}" as="ans" hint-placeholder-count="4">
        <button onClick="{{ ans.pick }}" style="height: 64px; border-radius: 14px; border: 1.5px solid {{ ans.border }}; background: {{ ans.bg }}; color: {{ ans.color }}; font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: -0.2px; cursor: pointer; font-variant-numeric: tabular-nums; box-shadow: {{ ans.shadow }}" style-hover="border-color: rgba(255,255,255,0.25)">{{ ans.label }}</button>
      </sc-for>
    </div>

    <div style="flex: 1"></div>

    <!-- XP çubuğu -->
    <div style="flex-shrink: 0">
      <div style="display: flex; justify-content: space-between; margin-bottom: 6px">
        <div style="font-size: 10px; font-weight: 700; color: #6c7178; letter-spacing: 0.6px">SET İLERLEMESİ</div>
        <div style="font-size: 10px; font-weight: 700; color: #4ade80; font-variant-numeric: tabular-nums">+40 XP</div>
      </div>
      <div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.07); overflow: hidden">
        <div style="height: 100%; width: 60%; border-radius: 3px; background: linear-gradient(90deg, #2fbf46, #4ade80); box-shadow: 0 0 8px rgba(74,222,128,0.5)"></div>
      </div>
    </div>
  </div>
</x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 500, &quot;height&quot;: 960}}">
class Component extends DCLogic {
  state = { playing: true, bypass: false, picked: null, t: 0 };
  componentDidMount() {
    this._raf = setInterval(() => { if (this.state.playing) this.setState(s => ({ t: s.t + 1 })); }, 90);
  }
  componentWillUnmount() { clearInterval(this._raf); }
  spectrum() {
    const e = React.createElement;
    const W = 400, H = 240;
    const grid = [];
    ['100', '1k', '10k'].forEach((l, i) => {
      const x = 90 + i * 120;
      grid.push(e('line', { key: 'v' + i, x1: x, y1: 0, x2: x, y2: H, stroke: 'rgba(255,255,255,0.05)', strokeWidth: 1 }));
      grid.push(e('text', { key: 'vt' + i, x: x + 4, y: H - 8, fontSize: 9, fontFamily: 'Inter', fill: '#4a4f56' }, l));
    });
    ['+12', '0', '-12', '-24'].forEach((l, i) => {
      const y = 40 + i * 50;
      grid.push(e('line', { key: 'h' + i, x1: 0, y1: y, x2: W, y2: y, stroke: 'rgba(255,255,255,0.05)', strokeWidth: 1 }));
      grid.push(e('text', { key: 'ht' + i, x: 8, y: y - 4, fontSize: 9, fontFamily: 'Inter', fill: '#4a4f56' }, l));
    });
    const t = this.state.t, bypass = this.state.bypass;
    // animated spectrum: pink-noise slope + boosted bell at ~1.2kHz (unless bypass)
    const pts = [];
    for (let i = 0; i <= 80; i++) {
      const x = i / 80 * W;
      let db = 150 - i * 0.55; // gentle downward slope baseline (px)
      const bell = bypass ? 0 : 46 * Math.exp(-Math.pow((i - 46) / 7, 2));
      const jitter = this.state.playing
        ? Math.sin(i * 1.7 + t * 0.9) * 4 + Math.sin(i * 0.6 - t * 0.5) * 6 * Math.exp(-Math.pow((i - 20) / 24, 2))
        : 0;
      pts.push([x, Math.max(18, db - bell + jitter)]);
    }
    let d = 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
    return e('svg', { width: '100%', height: '100%', viewBox: '0 0 400 240', preserveAspectRatio: 'none', style: { display: 'block' } },
      e('defs', null, e('linearGradient', { id: 'sg', x1: 0, y1: 0, x2: 0, y2: 1 },
        e('stop', { offset: 0, stopColor: 'rgba(34,211,238,0.35)' }),
        e('stop', { offset: 1, stopColor: 'rgba(34,211,238,0)' }))),
      grid,
      e('path', { d: d + ' L400,240 L0,240 Z', fill: 'url(#sg)' }),
      e('path', { d, fill: 'none', stroke: bypass ? '#8b8f96' : '#22d3ee', strokeWidth: 2 }));
  }
  renderVals() {
    const e = React.createElement;
    const { playing, bypass, picked } = this.state;
    const labels = ['250 Hz', '500 Hz', '1 kHz', '2 kHz'];
    return {
      noop: () => {},
      hearts: [0, 1, 2, 3, 4].map(i => i < 4
        ? { fill: '#ef4a5e', stroke: '#ef4a5e' }
        : { fill: 'none', stroke: 'rgba(255,255,255,0.22)' }),
      spectrum: this.spectrum(),
      togglePlay: () => this.setState(s => ({ playing: !s.playing })),
      playIcon: playing
        ? e('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'currentColor' }, e('rect', { x: 6, y: 5, width: 4.5, height: 14, rx: 1.5 }), e('rect', { x: 13.5, y: 5, width: 4.5, height: 14, rx: 1.5 }))
        : e('svg', { width: 28, height: 28, viewBox: '0 0 24 24', fill: 'currentColor', style: { marginLeft: 3 } }, e('path', { d: 'M7 4.8v14.4c0 .9 1 1.5 1.8 1L20 13c.8-.5.8-1.6 0-2.1L8.8 3.8C8 3.3 7 3.9 7 4.8Z' })),
      toggleBypass: () => this.setState(s => ({ bypass: !s.bypass })),
      bypassBorder: bypass ? 'rgba(34,211,238,0.7)' : 'rgba(255,255,255,0.12)',
      bypassBg: bypass ? 'rgba(34,211,238,0.1)' : 'rgba(255,255,255,0.05)',
      bypassColor: bypass ? '#22d3ee' : '#8f949b',
      bypassDot: bypass ? '#22d3ee' : '#4a4f56',
      bypassShadow: bypass ? '0 0 18px rgba(34,211,238,0.3), inset 0 0 8px rgba(34,211,238,0.08)' : 'none',
      answers: labels.map((label, i) => ({
        label,
        pick: () => this.setState({ picked: i }),
        border: picked === i ? '#4ade80' : 'rgba(255,255,255,0.1)',
        bg: picked === i ? 'rgba(74,222,128,0.09)' : 'linear-gradient(180deg, #17191d, #121316)',
        color: picked === i ? '#4ade80' : '#d6d9dd',
        shadow: picked === i ? '0 0 16px rgba(74,222,128,0.2)' : '0 4px 10px rgba(0,0,0,0.3)'
      }))
    };
  }
}
</script>
</body>
</html>
